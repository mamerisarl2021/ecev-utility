[supervisord]
nodaemon=true

[program:gunicorn]
command=gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers 3
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
